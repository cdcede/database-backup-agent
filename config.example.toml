# =============================================================================
# Backup Agent Configuration
# Copy this file to config.toml and adjust values for your environment.
# =============================================================================

[sql_server]
host = "localhost"
port = 1433

# Authentication: "sql" or "windows"
auth_method = "sql"

# Required only when auth_method = "sql"
username = "sa"
password = "your_password_here"

[backup]
# Local directory where .bak and .zip files are stored
# On Windows, you can use e.g. "C:\\Backups\\BackupAgent"
# On macOS/Linux, you can use e.g. "/tmp/backup-agent"
local_path = "/tmp/backup-agent"

[telegram]
enabled = false
bot_token = ""
chat_id = ""

[storage]
# Provider: "local" or "s3"
provider = "local"

# [storage.s3]
# endpoint = ""
# bucket = ""
# region = "us-east-1"
# access_key = ""
# secret_key = ""

# -----------------------------------------------------------------------------
# [storage.google_drive] — optional cloud mirror
# -----------------------------------------------------------------------------
# When enabled, every backup saved by the provider above is ALSO uploaded to
# Google Drive. The local copy is always written first; if the Drive upload
# fails, the job is reported as failed (Telegram alert) but the local copy stays.
#
# Retention: each task's retention_days also applies to Drive. After a backup
# reaches Drive, that database's older "<db>_YYYYMMDD_HHMMSS.zip" files in the
# target folder are PERMANENTLY deleted (not trashed, so the quota is freed).
# Other files in the folder are never touched. If the upload fails, no Drive
# file is deleted.
#
# One-time setup (OAuth "Web application" credentials + refresh token).
# Full step-by-step guide: docs/google-drive-setup.md
#   1. https://console.cloud.google.com -> create a project -> enable "Google Drive API".
#   2. "OAuth consent screen": External, add your Google account as a test user,
#      then PUBLISH the app ("In production"). Refresh tokens of apps left in
#      "Testing" expire after 7 days.
#   3. "Credentials" -> Create OAuth client ID -> type "Web application".
#      Under "Authorized redirect URIs" add:
#        https://developers.google.com/oauthplayground
#      -> copy the client ID and client secret.
#   4. https://developers.google.com/oauthplayground -> gear icon ->
#      "Use your own OAuth credentials" -> paste the client ID/secret.
#      Authorize the scope https://www.googleapis.com/auth/drive.file,
#      then "Exchange authorization code for tokens" -> copy the refresh token.
#   5. (Optional) Create a folder in Drive and copy its ID: the last segment of
#      https://drive.google.com/drive/folders/<FOLDER_ID>. Leave empty for root.
#      With the drive.file scope, use a folder created by this app or the root:
#      a folder created by hand in Drive is invisible to the agent. Create the
#      folder through the OAuth Playground with your own client (see the guide).
#
# [storage.google_drive]
# enabled = true
# client_id = "1234567890-xxxx.apps.googleusercontent.com"
# client_secret = ""
# refresh_token = ""
# folder_id = ""

[[tasks]]
name = "Default Backup Task"
databases = ["MyDatabase"]
# Scheduled backup time: 24h format (HH:MM) or a valid cron expression
schedule = "02:00"
# Automatically delete backups older than this many days
retention_days = 7

# =============================================================================
# [service] — Service runtime tuning (all fields are optional with defaults)
# =============================================================================
# [service]
# Maximum number of history entries kept in history.json.
# Oldest entries are removed first. Must be > 0. Default: 500.
# history_max_entries = 500
#
# Size (bytes) at which backup-agent.log is rotated on next startup.
# NOTE: this value is reserved for future use; the current implementation
# always uses the hardcoded 10 MiB default at startup because config is not
# yet loaded when log rotation runs.
# log_rotate_threshold_bytes = 10485760
